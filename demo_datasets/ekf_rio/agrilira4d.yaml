## Topics
topic_imu: "/rslidar_imu_data"
topic_radar_scan: "/radar_points"

## Extrinsic calibration of body frame to radar frame
# translation of radar frame expressed in body frame
l_b_r_x: 0.00425
l_b_r_y: -0.10798
l_b_r_z: 0.03291
   
# rotation radar frame to body frame
q_b_r_w: 0.055479
q_b_r_x: 0.704927
q_b_r_y: -0.055479
q_b_r_z: -0.704927 

# length of each radar frame (="exposure time" of radar scan) in milliseconds
radar_frame_ms: 18.5

# nominal radar rate
radar_rate: 10
